<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Scoreboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>Scoreboard</h1>
      <button id="refresh" class="icon-btn" aria-label="Refresh">⟳</button>
    </div>
    <nav id="sports" class="chips" aria-label="Sports"></nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Views">
    <button data-tab="live">Live</button>
    <button data-tab="today">Today</button>
    <button data-tab="upcoming">Upcoming</button>
    <button data-tab="tables">Tables</button>
    <button data-tab="news">News</button>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
